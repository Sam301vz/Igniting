<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Igniting Strategy — Team Venezuela</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080A12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Igniting Strategy">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@font-face{font-family:'IgFlags';font-display:swap;unicode-range:U+1F1E6-1F1FF;
src:url('fonts/flags.woff2') format('woff2'),
url('https://fonts.gstatic.com/s/notocoloremoji/v34/Yq6P-KqIXTD0t4D9GbWqBBApgz1_9Q.woff2') format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
:root{
--ink:#080A12;--ash:#121726;--ash2:#1A2133;--ash3:#242C42;--line:#39435E;
--text:#EFF1F7;--dim:#8E97AE;--ember:#F5793B;--ember2:#FBB040;
--magenta:#E8437A;--coral:#F0576B;--teal:#35BFAE;--violet:#6C6BD8;
--red:#E8412F;--blue:#4A72E8;--ok:#35BFAE;
--flame:linear-gradient(180deg,#FBB040 0%,#F5793B 45%,#E8437A 100%);
--display:"Bahnschrift","DIN Alternate","Oswald","Arial Narrow",system-ui,sans-serif;
--body:ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
--mono:ui-monospace,"SFMono-Regular","Consolas","Roboto Mono",monospace;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);cursor:pointer;border:0;color:inherit;background:none;letter-spacing:.06em}
select,input{font-family:var(--body);color:var(--text);background:var(--ash2);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13px;width:100%}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;
background:radial-gradient(90% 70% at 50% -8%,#F5793B22 0%,transparent 60%),
radial-gradient(70% 60% at 12% 105%,#35BFAE26 0%,transparent 62%),
radial-gradient(70% 60% at 88% 100%,#6C6BD826 0%,transparent 62%),
linear-gradient(180deg,#141A2B 0%,#0A0D18 55%,#080A12 100%);text-align:center;z-index:30}
#menu .spark{position:absolute;inset:0;pointer-events:none;opacity:.5;
background:radial-gradient(2px 2px at 20% 70%,rgba(232,67,122,.75),transparent 60%),
radial-gradient(2px 2px at 72% 40%,rgba(251,176,64,.7),transparent 60%),
radial-gradient(1.5px 1.5px at 45% 85%,rgba(53,191,174,.6),transparent 60%),
radial-gradient(1.5px 1.5px at 85% 78%,rgba(108,107,216,.55),transparent 60%)}
#menu h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,6.4vw,64px);line-height:.98;letter-spacing:.02em;text-transform:uppercase}
#menu h1 .byline{display:block;font-size:clamp(13px,1.9vw,20px);letter-spacing:.34em;color:var(--dim);margin-top:6px;text-transform:lowercase;font-weight:400}
#menu h1 em{font-style:normal;display:block;background:linear-gradient(92deg,#FBB040,#F5793B 40%,#E8437A 75%,#6C6BD8);
-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(232,67,122,.35))}
#menu .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
#logoBox{width:min(78vw,360px);padding:16px 20px;border:2px solid transparent;border-radius:16px;display:flex;align-items:center;justify-content:center;
background:linear-gradient(160deg,#0B0D14,#05070C) padding-box,linear-gradient(150deg,#FBB040,#E8437A 55%,#6C6BD8) border-box;
box-shadow:0 18px 44px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
#logoBox img{width:100%;height:auto;display:block}
#logoBox span{font-family:var(--display);letter-spacing:.16em;font-size:15px;color:var(--dim);text-transform:uppercase}
.menuBtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.bigBtn{padding:15px 26px;border-radius:11px;font-size:17px;text-transform:uppercase;font-weight:700;
background:linear-gradient(180deg,var(--ash3),#141A28);border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);transition:transform .12s,border-color .12s}
.bigBtn:hover{transform:translateY(-2px);border-color:var(--magenta)}
.bigBtn.ember{background:linear-gradient(120deg,#FBB040,#F5793B 45%,#E8437A);color:#2A0A16;border-color:#FFC97A}
#menu .foot{font-size:11px;color:var(--dim);letter-spacing:.12em}
.langRow{display:flex;gap:8px;padding:5px;border-radius:26px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.langBtn{padding:8px 15px;border-radius:22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);transition:.15s}
.langBtn.sel{background:linear-gradient(120deg,#FBB040,#F5793B 50%,#E8437A);color:#2A0A16;font-weight:700}

#app{display:none;height:100%;width:100%}
#app.on{display:flex}
#stage{flex:1 1 auto;min-width:0;padding:10px;display:flex;gap:10px;align-items:center;justify-content:center;position:relative}
#rail{display:flex;gap:8px;min-width:0}
#hud{display:none;align-items:stretch;gap:8px}
#hud.on{display:flex}
#hud>div{background:linear-gradient(180deg,var(--ash2),#11162A);border:1px solid var(--line);border-radius:11px;
padding:7px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.45)}
#hud .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
#hud .v{font-family:var(--display);font-size:clamp(18px,3.2vw,28px);line-height:1.05}
#hud .hSide{flex:1}
#hud .hSide.red .v{color:#FF8E86}
#hud .hSide.blue .v{color:#9E9DF0}
#hud .hExt{flex:1}
#hud .hExt .v{color:var(--ember2);font-size:clamp(15px,2.4vw,22px)}
#hud .hClock{flex:1.5;border-color:transparent;background:linear-gradient(180deg,#1B2233,#0F1424) padding-box,
linear-gradient(120deg,#FBB040,#F5793B 50%,#6C6BD8) border-box;border:2px solid transparent}
#hud .hClock .s{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--ember2);text-transform:uppercase}
#hud .hClock .m{font-family:var(--display);font-size:clamp(26px,5vw,44px);line-height:1.02;letter-spacing:.02em}
#hud2{display:none;width:100%;max-width:min(100%,calc(100vh - 84px));gap:8px}
#hud2.on{display:flex}
#hud2 .hP{flex:1;background:linear-gradient(180deg,var(--ash2),#11162A);border:1px solid var(--line);border-radius:10px;
padding:6px 10px;display:flex;align-items:center;gap:9px}
#hud2 .hP .k{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--ember2)}
#hud2 .hP .v{font-family:var(--display);font-size:clamp(12px,1.8vw,16px);letter-spacing:.04em}
#hud2 #hP1{border-left:3px solid #FF8E86}
#hud2 #hP2{border-left:3px solid #9E9DF0}
#hud.warn .hClock{animation:beat .9s ease-in-out infinite}
#hud.warn .hClock .m{color:#FFD98A}
@keyframes beat{0%,100%{box-shadow:0 8px 20px rgba(0,0,0,.45)}50%{box-shadow:0 8px 26px rgba(232,67,122,.55)}}
#wrap{margin:0 auto}
#wrap{position:relative;aspect-ratio:1/1;flex:0 0 auto;min-width:0}
canvas{width:100%;height:100%;display:block;border-radius:12px;border:1px solid var(--line);
box-shadow:0 24px 60px rgba(0,0,0,.65),0 0 0 1px rgba(232,67,122,.12);touch-action:none;background:#0E1A11}

.pad{position:absolute;bottom:3.5%;width:26%;aspect-ratio:1/1;border-radius:50%;touch-action:none;display:none;
background:url('joystick_base.png') center/contain no-repeat,radial-gradient(circle at 38% 32%,#4A443C,#1B1815 70%);
border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 24px rgba(0,0,0,.55),inset 0 2px 10px rgba(0,0,0,.5);opacity:.86}
.pad .knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;transform:translate(-50%,-50%);
background:url('joystick_stick.png') center/contain no-repeat,radial-gradient(circle at 36% 30%,#8E877C,#3A342C 72%);
border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 14px rgba(0,0,0,.6)}
#padP1{left:3%}#padP2{left:3%}
.act{position:absolute;bottom:6%;width:19%;aspect-ratio:1/1;border-radius:50%;display:none;align-items:center;justify-content:center;
font-family:var(--display);font-size:clamp(10px,1.5vw,17px);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#1A0B02;
background:linear-gradient(150deg,#FBB040,#F5793B 55%,#E8437A);border:2px solid rgba(255,255,255,.3);box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35)}
#actP1{right:3%}#actP2{right:3%}
.act.shoot{background:linear-gradient(180deg,#8E8DF0,#3A3DAE);color:#0A0B2B}
.act.climb{background:linear-gradient(180deg,#6FE0D0,#1B8C7F);color:#02201C}
.act.climb.on{background:linear-gradient(180deg,#FFE08A,#E0A020);color:#2B1A00}
.act.load{background:linear-gradient(180deg,#C9A7FF,#6B3FD4);color:#150634}
.act{touch-action:none;user-select:none}
.act:active{transform:scale(.95)}
.on2p .pad{width:21%;bottom:3%}
.on2p #padP1{left:2%;right:auto}
.on2p #padP2{left:auto;right:2%}
.on2p .act{width:14.5%;bottom:5%}
.on2p #actP1{left:24%;right:auto}
.on2p #actP2{right:24%;left:auto}

#panel{flex:1;min-width:300px;background:linear-gradient(180deg,var(--ash),#0B0F1A);border-left:1px solid var(--line);
display:flex;flex-direction:column;overflow:hidden}
.phead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.phead .t{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:14px}
.phead .t b{color:var(--ember)}
.phead #btnMenu{margin-left:8px}
.phead button{margin-left:auto;font-size:11px;padding:7px 11px;border:1px solid var(--line);border-radius:7px;text-transform:uppercase;background:var(--ash2)}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#0D1220;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:62px;padding:11px 8px;font-size:11px;text-transform:uppercase;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.sel{color:var(--text);border-bottom-color:var(--ember)}
.pbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.pbody::-webkit-scrollbar{width:8px}.pbody::-webkit-scrollbar-thumb{background:var(--ash3);border-radius:8px}
.card{background:linear-gradient(180deg,var(--ash2),#141A28);border:1px solid var(--line);border-radius:11px;padding:13px;
box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)}
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:2px 0 8px}
.row{display:flex;gap:8px;align-items:center}
.btn{padding:10px 12px;border-radius:8px;font-size:12px;text-transform:uppercase;background:var(--ash3);border:1px solid var(--line);flex:1;text-align:center;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--ember)}
.btn.sel{background:linear-gradient(120deg,#FBB040,#F5793B 50%,#E8437A);color:#2A0A16;border-color:#FFC97A}
.btn.red.sel{background:linear-gradient(180deg,#F0576B,#B01D2A);color:#fff;border-color:#F58E9B}
.btn.blue.sel{background:linear-gradient(180deg,#6C6BD8,#2C2F8C);color:#fff;border-color:#9E9DF0}
.btn.rec{background:linear-gradient(180deg,#E8437A,#9C1440);color:#fff;border-color:#F58BB0}
.btn:disabled{opacity:.38;cursor:not-allowed}
.mini{font-size:11px;color:var(--dim);line-height:1.55}
.rbot{border:1px solid var(--line);border-radius:10px;padding:10px;background:#161C2C;margin-bottom:9px}
.rbot .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fp{position:relative}
.fpInput{width:100%}
.fpList{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:20;max-height:230px;overflow-y:auto;
background:#151B2B;border:1px solid var(--line);border-radius:9px;box-shadow:0 16px 34px rgba(0,0,0,.65)}
.fpList.on{display:block}
.fpList::-webkit-scrollbar{width:7px}.fpList::-webkit-scrollbar-thumb{background:var(--ash3);border-radius:8px}
.fpItem{display:flex;align-items:center;gap:8px;padding:7px 9px;font-size:12px;cursor:pointer}
.fpItem:hover{background:var(--ash3)}
.fpNone{padding:9px;font-size:11px;color:var(--dim)}
.chipE{font-size:20px;line-height:1;flex:0 0 auto}
.fpItem .chipE,.tk .hd .chipE{font-size:22px}
.chip{width:26px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.25);overflow:hidden;display:flex;flex-direction:column;flex:0 0 auto}
.chip i{flex:1}
.rbot .n{font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
body.lay-h .grid2{grid-template-columns:1fr}
.drag{cursor:grab;border:1px solid var(--line);border-radius:10px;padding:10px;background:#161C2C;margin-bottom:8px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.drag>*{min-width:0}
.drag.over{border-color:var(--magenta);background:#252A47}
.drag .num{font-family:var(--mono);font-size:11px;color:var(--ember);width:16px}
.drag select{width:auto;flex:1 1 92px;min-width:88px;padding:5px 6px;font-size:12px}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-3px 0 12px;padding:0 4px 0 12px}
.tlab{flex:1 1 100%;font-size:10px;color:var(--dim);display:flex;justify-content:space-between}
.tval{font-family:var(--mono);font-size:12px;color:var(--ember2);min-width:38px;text-align:right}
.trange{-webkit-appearance:none;appearance:none;flex:1 1 100px;min-width:80px;height:4px;padding:0;border:0;border-radius:4px;
background:linear-gradient(90deg,#E8437A,#F5793B,#FBB040)}
.trange::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#FBB040;border:2px solid #2A0A16;cursor:pointer}
.trange::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#FBB040;border:2px solid #2A0A16;cursor:pointer}
.drag .gr{color:var(--dim);letter-spacing:.2em;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left;color:var(--dim)}
thead th{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
tr.tot td{font-family:var(--display);font-size:16px;border-bottom:0;padding-top:11px}
.cRed{color:#FF8E86}.cBlue{color:#9E9DF0}
.live{display:flex;gap:8px}
.live .box{flex:1;border-radius:10px;padding:9px;text-align:center;border:1px solid var(--line);background:#161C2C}
.live .box .v{font-family:var(--display);font-size:24px;line-height:1}
.live .box .k{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;margin-top:3px}
.warn{border-left:3px solid var(--ember);padding-left:9px;font-size:11px;color:var(--dim);line-height:1.55}
.hide{display:none!important}
#tasksFab{position:absolute;top:3%;right:3%;display:none;align-items:center;gap:7px;padding:9px 14px;border-radius:22px;
font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#1A0B02;cursor:pointer;
background:linear-gradient(120deg,#FBB040,#F5793B 50%,#E8437A);border:1px solid rgba(255,255,255,.4);
box-shadow:0 10px 26px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.5);z-index:6}
#tasksFab.on{display:flex}
#endBtns{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);display:flex;gap:10px;z-index:8}
#endBtns.hide{display:none}
#endBtns button{padding:12px 20px;border-radius:11px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;
border:1px solid var(--line);background:linear-gradient(180deg,var(--ash3),#141A28);box-shadow:0 10px 26px rgba(0,0,0,.55)}
#endBtns #btnAgain{background:linear-gradient(120deg,#FBB040,#F5793B 50%,#E8437A);color:#2A0A16;border-color:#FFC97A;font-weight:700}
#tasksFab .dot{width:8px;height:8px;border-radius:50%;background:#3E0A1E}
#tasksBubble{position:absolute;top:11%;right:3%;width:min(74%,340px);max-height:78%;overflow-y:auto;z-index:7;
background:linear-gradient(180deg,#1B2233,#11162408);border:1px solid var(--line);border-radius:14px;padding:12px;
box-shadow:0 22px 50px rgba(0,0,0,.7);animation:pop .16s ease-out}
#tasksBubble::before{content:"";position:absolute;top:-9px;right:26px;width:16px;height:16px;transform:rotate(45deg);
background:#1B2233;border-left:1px solid var(--line);border-top:1px solid var(--line)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
#tasksBubble::-webkit-scrollbar{width:7px}#tasksBubble::-webkit-scrollbar-thumb{background:var(--ash3);border-radius:8px}
.tbHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tbHead span{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember2)}
.tbHead button{margin-left:auto;width:24px;height:24px;border-radius:7px;background:var(--ash3);border:1px solid var(--line);font-size:13px}
.tk{border:1px solid var(--line);border-radius:11px;background:#161C2C;padding:10px;margin-bottom:9px}
.tk .hd{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.tk .hd .chip{width:32px;height:22px}
.tk .hd .nm{font-family:var(--display);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tk .hd .ord{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ember);letter-spacing:.1em}
.tk .t1{font-size:11px;color:var(--dim);line-height:1.5;margin-bottom:8px;border-left:2px solid var(--ember);padding-left:8px}
.tk .t1 b{color:var(--text)}
.tk textarea{width:100%;min-height:56px;resize:vertical;font-family:var(--body);font-size:12px;line-height:1.45;
color:var(--text);background:var(--ash2);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.tk textarea:focus{outline:2px solid var(--ember);outline-offset:1px}
.tk .cap{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
body.lay-h #app.on{flex-direction:row}
body.lay-h #stage{flex-direction:row;align-items:stretch;justify-content:center;padding:8px}
body.lay-h #rail{flex-direction:column;width:clamp(148px,19vw,230px);flex:0 0 auto;overflow-y:auto;padding-right:2px}
body.lay-h #rail::-webkit-scrollbar{width:6px}
body.lay-h #rail::-webkit-scrollbar-thumb{background:var(--ash3);border-radius:8px}
body.lay-h #hud,body.lay-h #hud2{flex-direction:column;width:100%}
body.lay-h #hud .hClock .m{font-size:clamp(24px,3.6vh,38px)}
body.lay-h #stage{min-width:0}
body.lay-h #wrap{width:min(100%,calc(100vh - 26px));height:auto;flex:0 1 auto}
body.lay-h #tasksBubble{position:static;width:100%;max-height:none;box-shadow:none;padding:10px;animation:none}
body.lay-h #tasksBubble::before{display:none}
body.lay-h #tasksFab,body.lay-h #tbClose{display:none!important}
body.lay-h #panel{flex:0 0 clamp(268px,27vw,400px);border-left:1px solid var(--line);border-top:0}
body.lay-v #app.on{flex-direction:column}
body.lay-v #stage{flex-direction:column;flex:0 0 auto;padding:8px}
body.lay-v #rail{flex-direction:column;width:100%;max-width:min(100%,calc(100vh - 300px))}
body.lay-v #hud{flex-direction:row;width:100%}
body.lay-v #hud2{flex-direction:row;width:100%}
body.lay-v #panel{flex:1 1 auto;min-width:0;border-left:0;border-top:1px solid var(--line)}
body.lay-v #stage{min-width:0}
body.lay-v #wrap{width:min(100%,calc(100vh - 300px))}
body.nopanel #panel{display:none}

async function loadFlagManifest(){
try{
const r=await fetch('flags/manifest.json',{cache:'no-store'});
if(!r.ok)return;
const list=await r.json();
if(!Array.isArray(list)||!list.length)return;
const out=[];
for(const f of list){
const name=String(f).replace(/\.[^.]+$/,'').replace(/[_-]/g,' ');
const ok=await loadImage('flag:'+f,'flags/'+f);
out.push({n:name,c:['#5A544B','#7C7568','#5A544B'],file:ok?f:null});
}
if(out.length)FLAGS=out;
}catch(e){}
}

function R(k){const f=FIELD_LAYOUT[k];return{x:f.x*W,y:f.y*H,w:f.w*W,h:f.h*H}}
function inRect(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
function nearRect(x,y,r,m){return x>=r.x-m&&x<=r.x+r.w+m&&y>=r.y-m&&y<=r.y+r.h+m}
function brace(side){const b=FIELD_LAYOUT.braces[side];return{ax:b.x1*W,ay:b.y1*H,bx:b.x2*W,by:b.y2*H}}
function bracePoint(side,t){const b=brace(side);return{x:b.ax+(b.bx-b.ax)*t,y:b.ay+(b.by-b.ay)*t}}
function bracePos(side,t,lane){
return bracePoint(side,clamp(t+(lane||0)*0.078,0.02,0.99));
}
function laneGroup(arr,key){
const gr={};
arr.forEach(r=>{const k=key(r);(gr[k]=gr[k]||[]).push(r)});
Object.keys(gr).forEach(k=>gr[k].forEach((r,i)=>r.lane=(gr[k].length-1)/2-i));
}
function distToBrace(side,x,y){
const b=brace(side),dx=b.bx-b.ax,dy=b.by-b.ay,L=dx*dx+dy*dy;
let t=((x-b.ax)*dx+(y-b.ay)*dy)/L;t=Math.max(0,Math.min(1,t));
return{d:Math.hypot(x-(b.ax+dx*t),y-(b.ay+dy*t)),t:t}
}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function fmt(t){t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')}
function zoneOf(t){return t<=1/3?'ZONE1':t<=2/3?'ZONE2':'ZONE3'}
function bnd(){return R('bounds')}

const S={
mode:null,alliance:'red',
strat:{robots:[],recording:false,recStart:0,recTimer:null,phase:'idle',playStart:0,drag:null,plan:[0,1,2],tab:'equipo',

game:{phase:'setup',t:0,pre:0,settle:0,released:0,players:1,p1:'red',p2Ally:false,

balls:[],fx:[],hp:{red:{q:0,t:0,anim:0},blue:{q:0,t:0,anim:0}},live:0,thrown:0,waveMsg:0,robots:[],score:{red:0,blue:0,ext:0},result:null,tab:'partido'}
};

function zoneSlot(alliance,i){
const z=R(alliance==='red'?'regionalZoneRed':'regionalZoneBlue');
return{x:z.x+z.w/2,y:z.y+z.h*(i+0.5)/3}
}
function newStratRobot(i){
const p=zoneSlot(S.alliance,i);
return{name:'Robot '+(i+1),flag:flagIdx('Venezuela'),x:p.x,y:p.y,angle:Math.PI/2,route:[],target:'ZONE1',tarea:'',climbAt:[30,22,14][i]||20,cT:null,done:false}
}
function makeRefBalls(){
const b=bnd(),arr=[];
for(let i=0;i<250;i++){
const a=Math.random()*Math.PI*2,rr=Math.pow(Math.random(),0.62)*W*0.155;
arr.push({x:clamp(b.x+b.w*0.5+Math.cos(a)*rr,b.x+BALL_R,b.x+b.w-BALL_R),
y:clamp(b.y+b.h*0.54+Math.sin(a)*rr*0.92,b.y+BALL_R,b.y+b.h-BALL_R)});
}
return arr;
}
function resetStrategyRobots(){
if(!S.strat.refBalls||!S.strat.refBalls.length)S.strat.refBalls=makeRefBalls();
S.strat.robots=[0,1,2].map(newStratRobot);
S.strat.plan=[0,1,2];S.strat.phase='idle';
}
function makeRobot(alliance,i,cpu){
const p=zoneSlot(alliance,i);
return{alliance:alliance,idx:i,cpu:cpu,name:(alliance==='red'?'R':'B')+(i+1),flag:i,
x:p.x,y:p.y,vx:0,vy:0,angle:alliance==='red'?0:Math.PI,balls:0,mode:'INTAKE',acc:0,loadAcc:0,lane:0,
onBrace:false,climbT:0,climbStart:0,tap:0,loadAnim:0,contact:false,goal:'collect'}
}
function newBall(){
const e=R('extinguisher'),b=bnd();
const sx=e.x+e.w*(0.22+Math.random()*0.56),sy=e.y+e.h*0.98;
const tx=b.x+b.w*(0.5+(Math.random()-0.5)*(0.36+Math.random()*0.5));
const ty=b.y+b.h*(0.40+Math.random()*0.54);
const k=1.5+Math.random()*1.1;
return{x:sx,y:sy,vx:(tx-sx)*k,vy:(ty-sy)*k,damp:k,live:true}
}
function throwBalls(n){
const g=S.game;
n=Math.min(n,TOTAL_WILDFIRE-g.thrown);
if(g.phase==='countdown')n=Math.min(n,FIRST_WAVE-g.thrown);
for(let i=0;i<n;i++){g.balls.push(newBall());g.thrown++;g.live++}
return n;
}
function startMatch(){
const g=S.game;
g.balls=[];g.fx=[];g.hp={red:{q:0,t:0,anim:0},blue:{q:0,t:0,anim:0}};g.thrown=0;g.live=0;g.waveMsg=0;g.robots=[];

g.robots.forEach((r,i)=>{r.flag=pool[i];r.name=FLAGS[pool[i]].n});
const r1=g.robots.find(r=>r.alliance===p1&&r.idx===0);
r1.cpu=false;r1.human=1;r1.name=g.p1Name||'Jugador 1';r1.flag=g.p1Flag;
if(g.players===2){
const al2=g.p2Ally?p1:other;

const pads={1:{ax:0,ay:0,id:null},2:{ax:0,ay:0,id:null}};
function bindPad(el,n){
const knob=el.querySelector('.knob');
function set(cx,cy){
const r=el.getBoundingClientRect(),R0=r.width/2;
let dx=cx-(r.left+R0),dy=cy-(r.top+R0),d=Math.hypot(dx,dy);
const lim=R0*0.62;if(d>lim){dx*=lim/d;dy*=lim/d}
pads[n].ax=dx/lim;pads[n].ay=dy/lim;
knob.style.transform='translate('+(dx-r.width*0.22)+'px,'+(dy-r.width*0.22)+'px)';
}
function reset(){pads[n].ax=0;pads[n].ay=0;knob.style.transform='translate(-50%,-50%)'}
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pads[n].id=e.pointerId;set(e.clientX,e.clientY)});
el.addEventListener('pointermove',e=>{if(pads[n].id===e.pointerId)set(e.clientX,e.clientY)});
const up=e=>{if(pads[n].id===e.pointerId){pads[n].id=null;reset()}};
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
bindPad(document.getElementById('padP1'),1);
bindPad(document.getElementById('padP2'),2);

function bindAct(el,n){
el.addEventListener('pointerdown',e=>{
e.preventDefault();
const r=humanRobot(n);if(!r)return;
if(canClimb(r))climbTap(r);else cycleMode(r);
updateActBtn();
});
}
function climbTap(r){
if(!r.onBrace){
const q=distToBrace(r.alliance,r.x,r.y);
r.onBrace=true;r.climbT=Math.max(q.t,0.04);r.climbStart=S.game.t;r.vx=0;r.vy=0;
}else r.climbT=Math.min(1,r.climbT+CLIMB_STEP);
r.tap=0.2;
}
function ownShield(r){return R(r.alliance==='red'?'fireShieldRed':'fireShieldBlue')}
function atShield(r){return nearRect(r.x,r.y,ownShield(r),RSIZE*0.72)}
function cycleMode(r){
r.acc=0;r.loadAcc=0;
if(atShield(r))r.mode=r.mode==='INTAKE'?'SHOOT':r.mode==='SHOOT'?'LOAD':'INTAKE';
else r.mode=r.mode==='SHOOT'?'INTAKE':'SHOOT';
}
bindAct(document.getElementById('actP1'),1);
bindAct(document.getElementById('actP2'),2);
function humanRobot(n){return S.game.robots.find(r=>r.human===n)}
function bracesVisible(){return S.mode==='game'&&S.game.phase!=='setup'&&S.game.t>=BRACE_REVEAL}
function canClimb(r){
if(!bracesVisible())return false;
if(r.onBrace)return true;
const q=distToBrace(r.alliance,r.x,r.y);
return q.d<RSIZE*1.0&&q.t<0.34;
}
function updateActBtn(){
[1,2].forEach(n=>{
const el=document.getElementById('actP'+n),r=humanRobot(n);
if(!el||!r)return;
let txt,cls='';
if(canClimb(r)){txt=r.onBrace?t('cClimbing'):t('cClimb');cls='climb'+(r.onBrace?' on':'')}
else if(r.mode==='SHOOT'){txt=t('cShoot');cls='shoot'}
else if(r.mode==='LOAD'){txt=t('cLoad');cls='load'}
else txt=t('cIntake');
if(el.textContent!==txt)el.textContent=txt;
if(el.className!=='act '+cls)el.className='act '+cls;
});
}

function stepStrategy(dt,now){
const st=S.strat;
if(st.phase==='play'){
const el0=(now-st.playStart)/1000;
let any=false;
st.robots.forEach(r=>{
if(!r.route.length)return;
const end=r.route[r.route.length-1];
if(el0<=end.t)any=true;
let i=0;while(i<r.route.length-1&&r.route[i+1].t<el0)i++;
const a=r.route[i],b=r.route[Math.min(i+1,r.route.length-1)];
const k=b.t>a.t?clamp((el0-a.t)/(b.t-a.t),0,1):0;
const nx=(a.x+(b.x-a.x)*k)*W,ny=(a.y+(b.y-a.y)*k)*H;
if(Math.hypot(nx-r.x,ny-r.y)>1.2)r.angle=Math.atan2(ny-r.y,nx-r.x);
r.x=nx;r.y=ny;
});
if(!any)startClimbAnim();
return;
}
if(st.phase==='climb'){
st.cClock-=dt;
const side=S.alliance;
let allDone=true;
st.plan.forEach(ri=>{
const r=st.robots[ri];
if(r.done)return;
allDone=false;
if(st.cClock>r.climbAt)return;
if(r.cT===null||r.cT===undefined){
const p=bracePos(side,0.20,r.lane);
const dx=p.x-r.x,dy=p.y-r.y,d=Math.hypot(dx,dy);
if(d<4){if(r.target==='CONTACT')r.done=true;else r.cT=0.20}
else{const v=Math.min(SPEED*0.85*dt,d);r.x+=dx/d*v;r.y+=dy/d*v;r.angle=Math.atan2(dy,dx)}
}else{
const goal=TARGET_T[r.target]||0.26;
r.cT=Math.min(goal,r.cT+dt*0.22);
const p=bracePos(side,r.cT,r.lane);r.x=p.x;r.y=p.y;
const b=brace(side);r.angle=Math.atan2(b.by-b.ay,b.bx-b.ax);
if(r.cT>=goal-0.001)r.done=true;
}
});
if(allDone&&st.cClock<=0){
st.cWait-=dt;
if(st.cWait<=0){resetToHome();st.phase='idle';renderPanel()}
}
return;
}
}

function stepGame(dt){
const g=S.game;
if(g.phase==='countdown'){
g.pre+=dt;stepFx(dt);stepHumans(dt);
const want=Math.min(FIRST_WAVE,Math.floor(g.pre/RELEASE_TIME*FIRST_WAVE));
if(g.thrown<want)throwBalls(want-g.thrown);
stepBalls(dt);
if(g.pre>=COUNTDOWN){
if(g.thrown<FIRST_WAVE)throwBalls(FIRST_WAVE-g.thrown);
g.phase='running';
}
return;
}
if(g.phase==='running'){
g.t+=dt;
if(g.waveMsg>0)g.waveMsg-=dt;
const left=MATCH_TIME-g.t;
if(g.thrown<SOFT_WILDFIRE){
if(g.live<LOW_MARK&&left>LAST_WAVE&&throwBalls(Math.min(WAVE,SOFT_WILDFIRE-g.thrown))>0)g.waveMsg=2.4;
}else if(g.thrown<TOTAL_WILDFIRE&&left>RESERVE_TIME&&g.live<RESERVE_MARK){
if(throwBalls(Math.min(WAVE,TOTAL_WILDFIRE-g.thrown))>0)g.waveMsg=2.4;
}
if(g.t>=MATCH_TIME){g.t=MATCH_TIME;g.phase='ended';g.settle=0}
}else if(g.phase==='ended'){
g.settle+=dt;
if(g.settle>=SETTLE_TIME&&!g.result){g.result=computeScore();g.tab='resultado';endBtns.classList.remove('hide');renderPanel()}
}
stepBalls(dt);stepFx(dt);stepHumans(dt);
S.game.robots.forEach(r=>{if(r.flash>0)r.flash-=dt;if(r.loadAnim>0)r.loadAnim-=dt});
['red','blue'].forEach(a=>laneGroup(g.robots.filter(r=>r.onBrace&&r.alliance===a).sort((x,y)=>x.climbStart-y.climbStart),r=>zoneOf(r.climbT)));
const active=g.phase==='running';
g.robots.forEach(r=>{
if(active){if(r.cpu)cpuThink(r,dt);else humanControl(r,dt)}else{r.vx=0;r.vy=0}
if(r.onBrace){
const p=bracePos(r.alliance,r.climbT,r.lane);r.x=p.x;r.y=p.y;
const b=brace(r.alliance);r.angle=Math.atan2(b.by-b.ay,b.bx-b.ax);
r.contact=false;
}else{
const bb=bnd();
if(Math.hypot(r.vx,r.vy)>2)r.angle=Math.atan2(r.vy,r.vx);
r.x=clamp(r.x+r.vx*dt,bb.x+RSIZE/2,bb.x+bb.w-RSIZE/2);
r.y=clamp(r.y+r.vy*dt,bb.y+RSIZE/2,bb.y+bb.h-RSIZE/2);
collideSolids(r);
const q=distToBrace(r.alliance,r.x,r.y);
r.contact=bracesVisible()&&q.d<RSIZE*0.85&&q.t<0.34;
}
if(active&&!r.onBrace){
if(r.mode==='LOAD'&&atShield(r)){
r.loadAcc+=dt*1000;
while(r.loadAcc>=LOAD_MS){
r.loadAcc-=LOAD_MS;
const room=MAX_BALLS-r.balls;
if(room>0)addLoadFx(r,Math.min(LOAD_QTY,room));
}
}else{
r.loadAcc=0;
const iv=(r.mode==='SHOOT'&&scoreSpot(r)==='ext')?SHIELD_MS:RATE_MS;
r.acc+=dt*1000;
while(r.acc>=iv){r.acc-=iv;doAction(r)}
}
pushBalls(r);
}
});
collideRobots(g.robots);
const bb2=bnd();
g.robots.forEach(r=>{if(r.onBrace)return;
r.x=clamp(r.x,bb2.x+RSIZE/2,bb2.x+bb2.w-RSIZE/2);
r.y=clamp(r.y,bb2.y+RSIZE/2,bb2.y+bb2.h-RSIZE/2);});
updateActBtn();
}
function stepBalls(dt){
const g=S.game,bb=bnd(),damp=Math.exp(-dt);
for(let i=0;i<g.balls.length;i++){
const b=g.balls[i];
if(!b.live||(b.vx===0&&b.vy===0))continue;
b.x+=b.vx*dt;b.y+=b.vy*dt;
const k=Math.pow(damp,b.damp);
b.vx*=k;b.vy*=k;
if(b.x<bb.x+BALL_R){b.x=bb.x+BALL_R;b.vx=-b.vx*0.45}
if(b.x>bb.x+bb.w-BALL_R){b.x=bb.x+bb.w-BALL_R;b.vx=-b.vx*0.45}
if(b.y<bb.y+BALL_R){b.y=bb.y+BALL_R;b.vy=-b.vy*0.45}
if(b.y>bb.y+bb.h-BALL_R){b.y=bb.y+bb.h-BALL_R;b.vy=-b.vy*0.45}
for(let s=0;s<SOLIDS.length;s++){
const r=R(SOLIDS[s]);
if(b.x>r.x-BALL_R&&b.x<r.x+r.w+BALL_R&&b.y>r.y-BALL_R&&b.y<r.y+r.h+BALL_R){
const dl=b.x+BALL_R-r.x,dr=r.x+r.w-(b.x-BALL_R),dt2=b.y+BALL_R-r.y,db=r.y+r.h-(b.y-BALL_R);
const m=Math.min(dl,dr,dt2,db);
if(m===dl){b.x=r.x-BALL_R;b.vx=-Math.abs(b.vx)*0.4}
else if(m===dr){b.x=r.x+r.w+BALL_R;b.vx=Math.abs(b.vx)*0.4}
else if(m===dt2){b.y=r.y-BALL_R;b.vy=-Math.abs(b.vy)*0.4}
else{b.y=r.y+r.h+BALL_R;b.vy=Math.abs(b.vy)*0.4}
}
}
if(Math.abs(b.vx)<2&&Math.abs(b.vy)<2){b.vx=0;b.vy=0}
}
}

function stepFx(dt){
const f=S.game.fx;
for(let i=f.length-1;i>=0;i--){
const o=f[i];o.t+=dt;
if(o.t<0)continue;
const k=o.t/o.dur;
if(k>=1){
if(o.sc==='load'){
if(o.rb&&o.rb.balls<MAX_BALLS)o.rb.balls++;
}
else if(o.sc==='ext'||o.sc===true)S.game.score.ext++;
else if(o.sc==='miss'){
const a=Math.random()*Math.PI*2,sp=W*(0.10+Math.random()*0.18);
S.game.balls.push({x:o.tx,y:o.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,damp:2.0,live:true});
S.game.live++;
}
f.splice(i,1);continue;
}
if(o.sc==='load'&&o.rb){o.tx=o.rb.x;o.ty=o.rb.y}
o.x=o.sx+(o.tx-o.sx)*k;
o.y=o.sy+(o.ty-o.sy)*k-Math.sin(k*Math.PI)*o.arc;
}
}
function drawFx(){
const f=S.game.fx;
for(let i=0;i<f.length;i++){
const o=f[i],k=o.t/o.dur,rr=BALL_R*(1.35-0.5*k);
ctx.save();
ctx.globalAlpha=0.35;ctx.strokeStyle=o.col;ctx.lineWidth=BALL_R*0.8;
ctx.beginPath();ctx.moveTo(o.sx+(o.tx-o.sx)*Math.max(0,k-0.18),o.sy+(o.ty-o.sy)*Math.max(0,k-0.18)-Math.sin(Math.max(0,k-0.18)*Math.PI)*o.arc);
ctx.lineTo(o.x,o.y);ctx.stroke();
ctx.globalAlpha=1;
ctx.beginPath();ctx.arc(o.x,o.y,rr,0,Math.PI*2);
ctx.fillStyle='#FF9A2E';ctx.fill();
ctx.strokeStyle=o.col;ctx.lineWidth=1.5;ctx.stroke();
ctx.restore();
}
S.game.robots.forEach(r=>{
if(r.loadAnim>0){
const a=r.loadAnim/0.55;
ctx.save();ctx.globalAlpha=a*0.75;
ctx.strokeStyle='#FFC15E';ctx.lineWidth=RSIZE*0.07;
ctx.beginPath();ctx.arc(r.x,r.y,RSIZE*(0.60-(1-a)*0.22),0,Math.PI*2);ctx.stroke();
ctx.restore();
}
if(!r.flash||r.flash<=0)return;
const a=r.flash/0.16;
ctx.save();ctx.globalAlpha=a*0.8;
ctx.strokeStyle='#FFD98A';ctx.lineWidth=RSIZE*0.09;
ctx.beginPath();ctx.arc(r.x,r.y,RSIZE*(0.42+(1-a)*0.35),0,Math.PI*2);ctx.stroke();
ctx.restore();
});
}
function pushBalls(r){
const g=S.game,rad=INTAKE_R*0.72;
for(let i=0;i<g.balls.length;i++){
const b=g.balls[i];if(!b.live)continue;
const dx=b.x-r.x,dy=b.y-r.y,d=Math.hypot(dx,dy);
if(d<rad&&d>0.001){
const k=(rad-d)/d;
b.x+=dx*k;b.y+=dy*k;
b.vx+=dx*k*2;b.vy+=dy*k*2;
}
}
}
function scoreSpot(r){
const su=R(r.alliance==='red'?'suppressionRed':'suppressionBlue');
if(nearRect(r.x,r.y,su,RSIZE*0.72))return 'sup';
if(nearRect(r.x,r.y,ownShield(r),RSIZE*0.72))return 'ext';
return null;
}
function doAction(r){
const g=S.game;
if(r.onBrace)return;
if(r.mode!=='SHOOT'){
if(r.balls>=MAX_BALLS)return;
let best=-1,bd=INTAKE_R;
for(let i=0;i<g.balls.length;i++){
const b=g.balls[i];if(!b.live)continue;
const d=Math.hypot(b.x-r.x,b.y-r.y);
if(d<bd){bd=d;best=i}
}
if(best>=0){g.balls[best].live=false;g.live--;r.balls++}
return;
}
if(r.balls<=0)return;
const spot=scoreSpot(r);
if(spot==='sup'){
r.balls--;g.score[r.alliance]++;
const su=R(r.alliance==='red'?'suppressionRed':'suppressionBlue');
addShot(r.x,r.y,su.x+su.w*(0.3+Math.random()*0.4),su.y+su.h*0.55,r.alliance==='red'?'#FF8E86':'#9E9DF0',false);
r.flash=0.16;
}else if(spot==='ext'){
r.balls--;g.hp[r.alliance].q++;
const f=ownShield(r);
addShot(r.x,r.y,f.x+f.w*(0.3+Math.random()*0.4),f.y+f.h*0.45,'#FBB040',false);
r.flash=0.16;
}
}
function humanControl(r,dt){
const p=pads[r.human],mag=Math.hypot(p.ax,p.ay);
if(r.tap>0)r.tap-=dt;
if(r.onBrace){
if(mag>0.6){r.onBrace=false;r.climbT=0}
else{r.climbT=Math.max(0.03,r.climbT-dt*CLIMB_DECAY);r.vx=0;r.vy=0;return}
}
r.vx=p.ax*SPEED*HUMAN_BOOST;r.vy=p.ay*SPEED*HUMAN_BOOST;
}
function cpuThink(r,dt){
const g=S.game;
if(bracesVisible()){
const want=r.idx===0?0.90:r.idx===1?0.58:0.26;
if(r.onBrace){r.climbT=Math.min(want,r.climbT+dt*0.15);r.vx=0;r.vy=0;return}
const q=distToBrace(r.alliance,r.x,r.y);
if(q.d<RSIZE*0.8&&q.t<0.32){r.onBrace=true;r.climbT=Math.max(q.t,0.05);r.climbStart=g.t;return}
const p=bracePoint(r.alliance,0.20);
driveTo(r,p.x,p.y);r.mode='SHOOT';return;
}
if(r.balls>=MAX_BALLS||(r.goal==='score'&&r.balls>0)){
r.goal='score';r.mode='SHOOT';
if(r.idx===2){
const fs=R(r.alliance==='red'?'fireShieldRed':'fireShieldBlue');
driveTo(r,fs.x+fs.w/2,fs.y-RSIZE*0.55);
}else{
const su=R(r.alliance==='red'?'suppressionRed':'suppressionBlue');
driveTo(r,su.x+su.w/2,su.y+su.h+RSIZE*0.55);
}
if(r.balls===0)r.goal='collect';
return;
}
r.goal='collect';r.mode='INTAKE';
let best=null,bd=1e9;
for(let i=r.idx;i<g.balls.length;i+=3){
const b=g.balls[i];if(!b.live)continue;
const d=Math.hypot(b.x-r.x,b.y-r.y);
if(d<bd){bd=d;best=b}
}
if(best)driveTo(r,best.x,best.y);else{r.vx=0;r.vy=0}
}
function driveTo(r,tx,ty){
const dx=tx-r.x,dy=ty-r.y,d=Math.hypot(dx,dy);
if(d<3){r.vx=0;r.vy=0;return}
r.vx=dx/d*SPEED*0.9;r.vy=dy/d*SPEED*0.9;
}

function levelOf(r){
if(r.onBrace)return zoneOf(r.climbT);
if(r.contact)return'CONTACT';
return'NONE';
}
function computeScore(){
const g=S.game,per={red:[],blue:[]};
g.robots.forEach(r=>per[r.alliance].push({name:r.name,lvl:levelOf(r)}));
const out={ext:g.score.ext,coop:0,red:{},blue:{},z3:0};
['red','blue'].forEach(a=>{
let mult=1,partner=0,z3=0;
per[a].forEach(p=>{mult+=INC[p.lvl]||0;if(p.lvl==='ZONE3')z3++});
if(z3>0)partner=per[a].filter(p=>p.lvl==='ZONE1'||p.lvl==='ZONE2').length*25;
out[a]={sup:g.score[a],mult:mult,partner:partner,robots:per[a],z3:z3};
out.z3+=z3;
});
out.coop=out.z3>=6?40:out.z3>=5?25:out.z3>=4?10:0;
['red','blue'].forEach(a=>{const o=out[a];o.total=Math.ceil(o.sup*o.mult+o.partner+out.ext+out.coop)});
return out;
}

finally{ctxRef(keep)}

return chipCache[key];
}

const plan=[];
ord.forEach(n=>{const i=st.robots.findIndex(r=>r.name===n);if(i>=0&&!plan.includes(i))plan.push(i)});
[0,1,2].forEach(i=>{if(!plan.includes(i))plan.push(i)});
st.plan=plan;
plan.forEach((ri,k)=>{if(zn[k])st.robots[ri].target=zn[k];if(tm[k])st.robots[ri].climbAt=+tm[k]});
}
st.tab='equipo';saveConfig();renderPanel();openTasks();
}

const fab=document.getElementById('tasksFab'),bubble=document.getElementById('tasksBubble'),tbBody=document.getElementById('tbBody');
const endBtns=document.getElementById('endBtns');
function endMatchUI(){endBtns.classList.add('hide');S.game.phase='setup';S.game.result=null;hideControls();renderPanel()}
document.getElementById('btnAgain').onclick=endMatchUI;
document.getElementById('btnExit').onclick=()=>document.getElementById('btnMenu').click();
const hud2=document.getElementById('hud2'),hP1=document.getElementById('hP1').querySelector('.v'),
hP2=document.getElementById('hP2').querySelector('.v'),btnLay=document.getElementById('btnLay');
let LAY='h';
function applyLayout(l,save){
LAY=(l==='v')?'v':'h';
document.body.classList.toggle('lay-v',LAY==='v');
document.body.classList.toggle('lay-h',LAY==='h');
btnLay.textContent=LAY==='h'?'⇅':'⇄';
if(save!==false)lsSet(LS_LAY,LAY);
}
btnLay.onclick=()=>{applyLayout(LAY==='h'?'v':'h',true);syncTasksUI()};
const btnHide=document.getElementById('btnHide'),btnShow=document.getElementById('btnShow');
function setPanel(open){
document.body.classList.toggle('nopanel',!open);
lsSet(LS_PAN,open?1:0);
}
btnHide.onclick=()=>setPanel(false);
btnShow.onclick=()=>setPanel(true);

const hudEl=document.getElementById('hud'),hMain=document.getElementById('hMain'),hSub=document.getElementById('hSub'),
hRedV=document.getElementById('hRedV'),hBlueV=document.getElementById('hBlueV'),hExtV=document.getElementById('hExtV');
fab.onclick=()=>{bubble.classList.contains('hide')?openTasks():bubble.classList.add('hide')};
document.getElementById('tbClose').onclick=()=>bubble.classList.add('hide');
function ordLabel(i){return LANG==='es'?(['1º','2º','3º','4º'][i]||(i+1)+'º'):(['1st','2nd','3rd','4th'][i]||(i+1)+'th')}
function renderTasks(){
const st=S.strat;
if(!st.robots.length||st.plan.length<3)return;
tbBody.innerHTML='';
st.plan.forEach((ri,pos)=>{
const r=st.robots[ri];
const box=el('div','tk');
box.innerHTML='<div class="hd">'+chipHTML(r.flag)+'<span class="nm">'+r.name+'</span><span class="ord">'+ordLabel(pos)+' '+t('toClimb')+'</span></div>'+
'<div class="t1"><b>'+t('task1')+'</b> '+t('t1a')+fmt(r.climbAt)+t('t1b')+ordLabel(pos)+t('t1c')+r.target+'</b>'+
(pos===0?t('t1first'):pos===st.plan.length-1?t('t1last'):t('t1mid'))+'</div>'+
'<div class="cap">'+t('task2')+'</div>';
const ta=el('textarea');
ta.placeholder=t('phTask');
ta.value=r.tarea||'';
ta.oninput=()=>{r.tarea=ta.value;saveConfig()};
box.appendChild(ta);
tbBody.appendChild(box);
});
}
function openTasks(){if(S.mode!=='strategy')return;renderTasks();bubble.classList.remove('hide')}
function syncTasksUI(){
const strat=S.mode==='strategy';
fab.classList.toggle('on',strat&&LAY==='v');
if(strat&&LAY==='h'){renderTasks();bubble.classList.remove('hide')}
else if(!strat)bubble.classList.add('hide');
}
function hideControls(){
['padP1','padP2','actP1','actP2'].forEach(i=>document.getElementById(i).style.display='none');
hud2.classList.remove('on');document.body.classList.remove('two');endBtns.classList.add('hide');
}

function applyLang(l){
LANG=I18N[l]?l:'en';
lsSet(LS_LANG,LANG);
document.querySelectorAll('.langBtn').forEach(b=>b.classList.toggle('sel',b.dataset.lang===LANG));
document.getElementById('btnStrategy').textContent=t('modeStrategy');
document.getElementById('btnGame').textContent=t('modeGame');
document.getElementById('btnMenu').textContent=t('menu');

document.getElementById('tbTitle').textContent=t('teamTasks');
document.getElementById('btnAgain').textContent=t('rAgain');
document.getElementById('btnExit').textContent=t('rExit');
document.getElementById('hRedK').textContent=t('hudRed');
document.getElementById('hBlueK').textContent=t('hudBlue');
document.getElementById('hExtK').textContent=t('hudExt');
if(S.mode)renderPanel();
if(!bubble.classList.contains('hide'))renderTasks();
updateActBtn();
}
document.querySelectorAll('.langBtn').forEach(b=>b.onclick=()=>applyLang(b.dataset.lang));
document.getElementById('btnStrategy').onclick=()=>enter('strategy');
document.getElementById('btnGame').onclick=()=>enter('game');
document.getElementById('btnMenu').onclick=()=>{
S.mode=null;S.game.phase='setup';S.game.result=null;
if(S.strat.recording)stopRec();
S.strat.phase='idle';
app.classList.remove('on');menu.style.display='flex';document.body.classList.remove('inapp');hideControls();
fab.classList.remove('on');bubble.classList.add('hide');hudEl.classList.remove('on');
};
function enter(m){
S.mode=m;menu.style.display='none';app.classList.add('on');document.body.classList.add('inapp');hideControls();
bubble.classList.add('hide');
hudEl.classList.add('on');
document.getElementById('hRedK').textContent=t('hudRed');
document.getElementById('hBlueK').textContent=t('hudBlue');
document.getElementById('hExtK').textContent=t('hudExt');
hudEl.querySelectorAll('.hSide,.hExt').forEach(e=>e.style.display=(m==='game')?'flex':'none');
syncTasksUI();
if(m==='strategy')resetStrategyRobots();
else{S.game.phase='setup';S.game.result=null;S.game.balls=[];S.game.robots=[]}
renderPanel();
}

const keys={};
function pressAct(n){
const r=humanRobot(n);if(!r)return;
if(canClimb(r))climbTap(r);else cycleMode(r);
updateActBtn();
}
addEventListener('keydown',e=>{
const k=e.key.toLowerCase();
if(keys[k])return;
keys[k]=true;
if(S.mode!=='game'||S.game.phase==='setup')return;
if(e.key===' '){e.preventDefault();pressAct(1)}
if(k==='q')pressAct(2);
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
setInterval(()=>{
if(S.mode!=='game'||S.game.phase==='setup')return;
const k1x=(keys['arrowright']?1:0)-(keys['arrowleft']?1:0);
const k1y=(keys['arrowdown']?1:0)-(keys['arrowup']?1:0);
const k2x=(keys['d']?1:0)-(keys['a']?1:0);
const k2y=(keys['s']?1:0)-(keys['w']?1:0);
if(pads[1].id===null){
if(k1x||k1y){const m=Math.hypot(k1x,k1y);pads[1].ax=k1x/m;pads[1].ay=k1y/m}
else if(!keys['arrowup']&&!keys['arrowdown']&&!keys['arrowleft']&&!keys['arrowright']){pads[1].ax=0;pads[1].ay=0}
}
if(pads[2].id===null){
if(k2x||k2y){const m=Math.hypot(k2x,k2y);pads[2].ax=k2x/m;pads[2].ay=k2y/m}
else if(!keys['w']&&!keys['a']&&!keys['s']&&!keys['d']){pads[2].ax=0;pads[2].ay=0}
}
},40);

if('serviceWorker' in navigator){
addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
}

const ok=await loadImage('cancha','cancha.png');

await Promise.all([loadImage('robot','robot.png'),loadImage('robot_full','robot_full.png'),loadImage('logo','logo_venezuela.png')]);
for(const k of Object.keys(SPRITE_FILE)){
if(await loadImage(k,SPRITE_FILE[k]))USE_IMG_SKIN=true;
}
await loadFlagManifest();
if(IMG.cancha&&IMG.cancha.width){W=IMG.cancha.width;H=IMG.cancha.height||IMG.cancha.width}
SPEED=W/5;RSIZE=W*0.068;INTAKE_R=W*0.0286;BALL_R=W*0.0072;
detectEmojiFlags();
cv.width=W;cv.height=H;
const box=document.getElementById('logoBox');
const im=new Image();
im.onload=()=>{box.innerHTML='';box.appendChild(im)};
im.src=IMG.logo?'logo_venezuela.png':LOGO_DATA;
S.game.p1Flag=flagIdx('Venezuela');S.game.p2Flag=flagIdx('Venezuela');
if(!loadConfig())resetStrategyRobots();
applyLayout(lsGet(LS_LAY)||(innerWidth>=innerHeight?'h':'v'),false);
setPanel(lsGet(LS_PAN)===0?false:true);
applyLang(lsGet(LS_LANG)||'en');
renderPanel();
loadFlagFont();
})();
